ul{list-style:none;padding:0;margin:28px 0;}
li a{display:block;background:var(--surf);border:1px solid var(--hair);border-radius:10px;padding:16px 20px;margin-bottom:10px;color:var(--ink-hi);text-decoration:none;font-weight:600;font-variant-numeric:tabular-nums;}
